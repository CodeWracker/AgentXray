[project]
name = "xray-agent-bench"
version = "0.2.0"
description = "Bancada para avaliar LLMs/agentes multimodais na leitura de radiografias, com ferramentas de visão computacional e torchxrayvision à disposição."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "torchxrayvision>=1.3",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "scikit-image",
    "scipy",
    "matplotlib",
    "pandas",
]

[tool.uv]
package = false

# CPU-only: os modelos são pequenos, as imagens são poucas, e CPU torna a inferência determinística e igual em qualquer máquina.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
